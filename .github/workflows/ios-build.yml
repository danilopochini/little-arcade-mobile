name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iPhone device app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package and verify iPhone app as IPA
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          IPA_DIR="build/ipa"

          echo "Checking app bundle..."
          test -d "$APP_PATH"

          echo "App bundle size:"
          du -sh "$APP_PATH"

          echo "Checking app metadata..."
          test -f "$APP_PATH/Info.plist"

          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          echo "Executable name:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP_PATH/Info.plist"

          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"

          cd "$IPA_DIR"
          /usr/bin/zip -qry LittleArcade.ipa Payload

          echo "IPA file size:"
          ls -lh LittleArcade.ipa

          echo "Checking IPA contents..."
          /usr/bin/unzip -l LittleArcade.ipa | head -40

          /usr/bin/unzip -Z1 LittleArcade.ipa \
            | grep -q '^Payload/App.app/Info.plist$'

          /usr/bin/unzip -Z1 LittleArcade.ipa \
            | grep -q '^Payload/App.app/'

          echo "IPA structure checks passed."

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: little-arcade-ipa
          path: build/ipa/LittleArcade.ipa
          if-no-files-found: error

      - name: Upload simulator build logs and app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/
          if-no-files-found: ignore
