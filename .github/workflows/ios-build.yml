
name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

          echo "App icon files after Capacitor sync:"
          find ios/App/App/Assets.xcassets/AppIcon.appiconset \
            -maxdepth 1 -type f -print

          echo "App icon Contents.json after Capacitor sync:"
          cat ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json

          echo "Checking icon image dimensions:"
          sips -g pixelWidth -g pixelHeight \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iPhone device app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify compiled app icon
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          ASSETS="$APP_PATH/Assets.car"

          echo "Checking active Xcode icon settings..."
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -showBuildSettings 2>/dev/null \
            | grep 'ASSETCATALOG_COMPILER_APPICON_NAME' || true

          echo "Checking app bundle..."
          test -d "$APP_PATH"
          ls -lh "$ASSETS"

          echo "Checking bundle identifier..."
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          echo "Checking compiled asset catalogue..."
          xcrun assetutil --info "$ASSETS" > build/asset-catalog.json

          echo "App icon-related asset entries:"
          grep -i -E 'appicon|icon-marketing|icon-1024' \
            build/asset-catalog.json || true

      - name: Package iPhone app as IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qr LittleArcade.ipa Payload

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: little-arcade-ipa
          path: build/ipa/LittleArcade.ipa
          if-no-files-found: error

      - name: Upload simulator build logs and app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/
          if-no-files-found: ignore

      - name: Upload asset catalogue inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-catalog-inspection
          path: build/asset-catalog.json
          if-no-files-found: ignore
