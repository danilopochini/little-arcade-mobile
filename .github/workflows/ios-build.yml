
name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive iPhone app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/LittleArcade.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create export options
        run: |
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string></string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.danilopochini.littlearcade</key>
                  <string></string>
              </dict>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/LittleArcade.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Verify exported IPA
        run: |
          set -euo pipefail

          IPA_PATH="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"

          echo "IPA size:"
          ls -lh "$IPA_PATH"

          echo "IPA contents:"
          /usr/bin/unzip -l "$IPA_PATH" | head -40

          /usr/bin/unzip -Z1 "$IPA_PATH" \
            | grep -q '^Payload/[^/]*.app/Info.plist$'

          echo "IPA structure check passed."

          mkdir -p build/ipa
          cp "$IPA_PATH" build/ipa/LittleArcade.ipa

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: little-arcade-ipa
          path: build/ipa/LittleArcade.ipa
          if-no-files-found: error

      - name: Upload simulator build logs and app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/
          if-no-files-found: ignore
